<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perpustakaan Kelas - Dashboard</title>
  <link rel="stylesheet" href="dasboard.css">
</head>
<body>

  <div class="app-layout">
    
    <!-- Sidebar Navigasi Full Height -->
    <aside class="sidebar">
      <div class="brand">
        <span class="icon">📖</span>
        <span class="brand-text">Perpustakaan Kelas</span>
      </div>

      <nav class="nav-menu">
        <a href="dasboard.html" class="nav-item active">
          <span class="icon">🏠</span> Dashboard
        </a>
        <a href="databuku.html" class="nav-item">
          <span class="icon">📖</span> Data Buku
        </a>
        <a href="daftaranggota.html" class="nav-item">
          <span class="icon">👥</span> Data Anggota
        </a>
        <a href="peminjaman.html" class="nav-item">
          <span class="icon">➡️</span> Peminjaman
        </a>
        <a href="pengembalian.html" class="nav-item">
          <span class="icon">↺</span> Pengembalian
        </a>
        <a href="laporan.html" class="nav-item">
          <span class="icon">📄</span> Laporan
        </a>
        
        <!-- Menu Logout di Sidebar -->
        <a href="ProyekloginPBL.html" class="nav-item nav-logout" id="sidebarLogout">
          <span class="icon">🚪</span> Logout
        </a>
      </nav>
    </aside>

    <!-- Area Konten Utama -->
    <main class="main-content">
      
      <!-- Header Atas Dashboard -->
      <header class="content-header">
        <h2>Dashboard</h2>
        
        <!-- Dropdown Profile Petugas -->
        <div class="user-profile-container">
          <div class="user-profile" id="userProfileBtn">
            <span class="icon">👤</span> Petugas <span class="arrow-down">▾</span>
          </div>
          <div class="profile-dropdown hidden" id="profileDropdown">
            <a href="#" id="dropdownLogout" class="dropdown-item danger">
              <span class="icon">🚪</span> Logout
            </a>
          </div>
        </div>
      </header>

      <!-- Grid Kartu Statistik -->
      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">📖</div>
          <div class="stat-label">Jumlah Buku</div>
          <div class="stat-value">120</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-label">Jumlah Anggota</div>
          <div class="stat-value">45</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">📄</div>
          <div class="stat-label">Buku Dipinjam</div>
          <div class="stat-value">18</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">⚠️</div>
          <div class="stat-label">Transaksi Terlambat</div>
          <div class="stat-value">3</div>
        </div>
      </section>

      <!-- Card Tabel Peminjaman Terbaru -->
      <section class="table-card">
        <h3 class="table-title">Peminjaman Terbaru</h3>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Nama Anggota</th>
                <th>Judul Buku</th>
                <th>Tgl Pinjam</th>
                <th>Jatuh Tempo</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="peminjamanTableBody">
              <!-- Data dimasukkan secara dinamis oleh JavaScript -->
            </tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

  <script src="dasboard.js"></script>
</body>
</html>
