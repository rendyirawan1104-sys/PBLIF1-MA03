<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perpustakaan Kelas - Data Anggota</title>
  <link rel="stylesheet" href="daftaranggota.css">
</head>
<body>

  <div class="app-layout">
    
    <aside class="sidebar">
      <div class="brand">
        <span class="icon">📖</span>
        <span class="brand-text">Perpustakaan Kelas</span>
      </div>

      <nav class="nav-menu">
        <a href="dasboard.html" class="nav-item">
          <span class="icon">🏠</span> Dashboard
        </a>
        <a href="databuku.html" class="nav-item">
          <span class="icon">📖</span> Data Buku
        </a>
        <a href="daftaranggota.html" class="nav-item active">
          <span class="icon">👥</span> Data Anggota
        </a>
        <a href="peminjaman.html" class="nav-item">
          <span class="icon">➡️</span> Peminjaman
        </a>
        <a href="pengembalian.html" class="nav-item">
          <span class="icon">↺</span> Pengembalian
        </a>
        <a href="laporan.html" class="nav-item">
          <span class="icon">📄</span> Laporan
        </a>
        
        <!-- Menu Logout -->
        <a href="login.html" class="nav-item nav-logout" id="sidebarLogout">
          <span class="icon">🚪</span> Logout
        </a>
      </nav>
    </aside>

    <main class="main-content">
      
      <header class="content-header">
        <div class="header-title">
          <h2>Data Anggota</h2>
        </div>
        
        <div class="user-profile-container">
          <div class="user-profile" id="userProfileBtn">
            <span class="icon">👤</span> Petugas <span class="arrow-down">▾</span>
          </div>
          <div class="profile-dropdown hidden" id="profileDropdown">
            <a href="#" id="dropdownLogout" class="dropdown-item danger">
              <span class="icon">🚪</span> Logout
            </a>
          </div>
        </div>
      </header>

      <div class="action-bar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Cari nama anggota...">
        </div>
        <button class="btn-primary" id="btnTambahAnggota">+ Tambah Anggota</button>
      </div>

      <section class="table-card">
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nama Anggota</th>
                <th>Kelas</th>
                <th>No. HP</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="anggotaTableBody">
              <!-- Data anggota dirender secara dinamis lewat JS -->
            </tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

  <div class="modal hidden" id="anggotaModal">
    <div class="modal-content">
      <h3 id="modalTitle">Tambah Anggota Baru</h3>
      <form id="anggotaForm">
        <div class="form-group">
          <label for="idAnggota">ID Anggota</label>
          <input type="text" id="idAnggota" required placeholder="Contoh: A006">
        </div>
        <div class="form-group">
          <label for="namaAnggota">Nama Anggota</label>
          <input type="text" id="namaAnggota" required placeholder="Nama lengkap...">
        </div>
        <div class="form-group">
          <label for="kelasAnggota">Kelas</label>
          <input type="text" id="kelasAnggota" required placeholder="Contoh: X TKJ 1">
        </div>
        <div class="form-group">
          <label for="nohpAnggota">No. HP</label>
          <input type="text" id="nohpAnggota" required placeholder="Contoh: 081234567890">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btnBatal">Batal</button>
          <button type="submit" class="btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="daftaranggota.js"></script>
</body>
</html>
