<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perpustakaan Kelas - Data Buku</title>
  <link rel="stylesheet" href="databuku.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="icon">📖</span>
        <span class="brand-text">Perpustakaan Kelas</span>
      </div>

      <nav class="nav-menu">
        <a href="dasboard.html" class="nav-item">
          <span class="icon">🏠</span> Dashboard
        </a>
        <a href="databuku.html" class="nav-item active">
          <span class="icon">📖</span> Data Buku
        </a>
        <a href="daftaranggota.html" class="nav-item">
          <span class="icon">👥</span> Data Anggota
        </a>
        <a href="peminjaman.html" class="nav-item">
          <span class="icon">➡️</span> Peminjaman
        </a>
        <a href="pengembalian.html" class="nav-item">
          <span class="icon">↺</span> Pengembalian
        </a>
        <a href="laporan.html" class="nav-item">
          <span class="icon">📄</span> Laporan
        </a>
        
        <a href="#" class="nav-item nav-logout" id="sidebarLogout">
          <span class="icon">🚪</span> Logout
        </a>
      </nav>
    </aside>

    <main class="main-content">
      
      <header class="content-header">
        <div class="header-title">
          <h2>Data Buku</h2>
          <p class="subtitle">Katalog • Pencarian • CRUD</p>
        </div>
        
        <div class="user-profile-container">
          <div class="user-profile" id="userProfileBtn">
            <span class="icon">👤</span> Petugas <span class="arrow-down">▾</span>
          </div>
          <div class="profile-dropdown hidden" id="profileDropdown">
            <a href="login.html" id="dropdownLogout" class="dropdown-item danger">
              <span class="icon">🚪</span> Logout
            </a>
          </div>
        </div>
      </header>

      <div class="action-bar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Cari judul / penulis...">
        </div>
        <button class="btn-primary" id="btnTambahBuku">+ Tambah Buku</button>
      </div>

      <section class="table-card">
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Kode</th>
                <th>Judul Buku</th>
                <th>Penulis</th>
                <th>Stok</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="bukuTableBody"></tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

  <div class="modal hidden" id="bukuModal">
    <div class="modal-content">
      <h3 id="modalTitle">Tambah Buku Baru</h3>
      <form id="bukuForm">
        <div class="form-group">
          <label for="kodeBuku">Kode Buku</label>
          <input type="text" id="kodeBuku" required placeholder="Contoh: B006">
        </div>
        <div class="form-group">
          <label for="judulBuku">Judul Buku</label>
          <input type="text" id="judulBuku" required placeholder="Judul buku...">
        </div>
        <div class="form-group">
          <label for="penulisBuku">Penulis</label>
          <input type="text" id="penulisBuku" required placeholder="Nama penulis...">
        </div>
        <div class="form-group">
          <label for="stokBuku">Stok</label>
          <input type="number" id="stokBuku" required min="1" placeholder="0">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btnBatal">Batal</button>
          <button type="submit" class="btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="databuku.js"></script>
</body>
</html>
