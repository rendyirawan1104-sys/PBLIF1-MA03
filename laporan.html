<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perpustakaan Kelas - Laporan</title>
  <link rel="stylesheet" href="laporan.css">
</head>
<body>

  <div class="app-layout">
    
    <aside class="sidebar">
      <div class="brand">
        <span class="icon">📖</span>
        <span class="brand-text">Perpustakaan Kelas</span>
      </div>

      <nav class="nav-menu">
        <a href="dasboard.html" class="nav-item">
          <span class="icon">🏠</span> Dashboard
        </a>
        <a href="databuku.html" class="nav-item">
          <span class="icon">📖</span> Data Buku
        </a>
        <a href="daftaranggota.html" class="nav-item">
          <span class="icon">👥</span> Data Anggota
        </a>
        <a href="peminjaman.html" class="nav-item">
          <span class="icon">➡️</span> Peminjaman
        </a>
        <a href="pengembalian.html" class="nav-item">
          <span class="icon">↺</span> Pengembalian
        </a>
        <a href="laporan.html" class="nav-item active">
          <span class="icon">📄</span> Laporan
        </a>
        
        <a href="login.html" class="nav-item nav-logout" id="sidebarLogout">
          <span class="icon">🚪</span> Logout
        </a>
      </nav>
    </aside>

    <main class="main-content">
      
      <header class="content-header">
        <div class="header-title">
          <h2>Laporan</h2>
        </div>
        
        <div class="user-profile-container">
          <div class="user-profile" id="userProfileBtn">
            <span class="icon">👤</span> Petugas <span class="arrow-down">▾</span>
          </div>
          <div class="profile-dropdown hidden" id="profileDropdown">
            <a href="#" id="dropdownLogout" class="dropdown-item danger">
              <span class="icon">🚪</span> Logout
            </a>
          </div>
        </div>
      </header>

      <div class="action-bar-right">
        <button class="btn-primary" id="btnFilterPeriode">
          <span class="btn-icon">📅</span> Filter Periode
        </button>
      </div>

      <section class="reports-grid">
        <div class="report-card">
          <div class="report-header">
            <span class="report-icon">📖</span>
            <span class="report-label">Rekap Peminjaman</span>
          </div>
          <div class="report-value" id="valRekapPeminjaman">18</div>
        </div>

        <div class="report-card">
          <div class="report-header">
            <span class="report-icon">⚠️</span>
            <span class="report-label">Buku Terlambat</span>
          </div>
          <div class="report-value" id="valBukuTerlambat">3</div>
        </div>

        <div class="report-card">
          <div class="report-header">
            <span class="report-icon">📄</span>
            <span class="report-label">Riwayat Transaksi</span>
          </div>
          <div class="report-value" id="valRiwayatTransaksi">42</div>
        </div>
      </section>

    </main>

  </div>

  <script src="laporan.js"></script>
</body>
</html>
