<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perpustakaan Kelas - Transaksi Peminjaman</title>
  <link rel="stylesheet" href="peminjaman.css">
</head>
<body>

  <div class="app-layout">
    
    <aside class="sidebar">
      <div class="brand">
        <span class="icon">📖</span>
        <span class="brand-text">Perpustakaan Kelas</span>
      </div>

      <nav class="nav-menu">
        <a href="dasboard.html" class="nav-item">
          <span class="icon">🏠</span> Dashboard
        </a>
        <a href="databuku.html" class="nav-item">
          <span class="icon">📖</span> Data Buku
        </a>
        <a href="daftaranggota.html" class="nav-item">
          <span class="icon">👥</span> Data Anggota
        </a>
        <a href="peminjaman.html" class="nav-item active">
          <span class="icon">➡️</span> Peminjaman
        </a>
        <a href="pengembalian.html" class="nav-item">
          <span class="icon">↺</span> Pengembalian
        </a>
        <a href="laporan.html" class="nav-item">
          <span class="icon">📄</span> Laporan
        </a>
        
        <a href="login.html" class="nav-item nav-logout" id="sidebarLogout">
          <span class="icon">🚪</span> Logout
        </a>
      </nav>
    </aside>

    <main class="main-content">
      
      <header class="content-header">
        <div class="header-title">
          <h2>Transaksi Peminjaman</h2>
        </div>
        
        <div class="user-profile-container">
          <div class="user-profile" id="userProfileBtn">
            <span class="icon">👤</span> Petugas <span class="arrow-down">▾</span>
          </div>
          <div class="profile-dropdown hidden" id="profileDropdown">
            <a href="#" id="dropdownLogout" class="dropdown-item danger">
              <span class="icon">🚪</span> Logout
            </a>
          </div>
        </div>
      </header>

      <section class="card-container">
        <h3 class="card-title">Form Peminjaman Buku</h3>
        
        <form id="peminjamanForm">
          <div class="form-grid">
            
            <div class="form-group">
              <label for="pilihAnggota">Pilih Anggota</label>
              <select id="pilihAnggota" required>
                <option value="" disabled selected>Pilih anggota...</option>
                <option value="A001">Andi Pratama (X TKJ 1)</option>
                <option value="A002">Siti Nurhaliza (X MM 1)</option>
                <option value="A003">Budi Santoso (XI TKJ 2)</option>
                <option value="A004">Rina Marlina (XI MM 1)</option>
                <option value="A005">Fahri Ananda (XII TKJ 1)</option>
              </select>
            </div>

            <div class="form-group">
              <label for="pilihBuku">Pilih Buku</label>
              <select id="pilihBuku" required>
                <option value="" disabled selected>Pilih buku...</option>
                <option value="B001">Laskar Pelangi</option>
                <option value="B002">Bumi Manusia</option>
                <option value="B003">Dilan 1990</option>
                <option value="B004">Negeri 5 Menara</option>
                <option value="B005">Matematika Dasar</option>
              </select>
            </div>

            <div class="form-group">
              <label for="tglPinjam">Tanggal Pinjam</label>
              <input type="date" id="tglPinjam" required>
            </div>

            <div class="form-group">
              <label for="tglJatuhTempo">Tanggal Jatuh Tempo</label>
              <input type="date" id="tglJatuhTempo" required>
            </div>

          </div>

          <button type="submit" class="btn-submit">
            <span class="btn-icon">💾</span> Simpan Peminjaman
          </button>
        </form>
      </section>

      <section class="card-container summary-card">
        <h3 class="card-title">Ringkasan Peminjaman</h3>
        
        <div class="summary-content">
          <div class="summary-icon">📖</div>
          <div class="summary-details">
            <p><span>Total Peminjaman</span> : <strong id="totalPeminjaman">0</strong></p>
            <p><span>Buku Dipinjam</span> : <strong id="bukuDipinjam">0</strong></p>
            <p><span>Anggota Aktif</span> : <strong id="anggotaAktif">0</strong></p>
          </div>
        </div>
      </section>

    </main>

  </div>

  <script src="peminjaman.js"></script>
</body>
</html>
